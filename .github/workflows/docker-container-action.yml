name: Docker Container Workflow

on:
  push:
    paths:
      - "Dockerfile"
      - "container-script.sh"
      - ".github/workflows/docker-container-action.yml"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      APP_MESSAGE: "Hola desde el runner de GitHub Actions"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t so-gha-demo .

      - name: Create host directory for volume
        run: mkdir -p host-data

      - name: Run container with volume and env var
        run: |
          docker run --name so-demo \
            -e APP_MESSAGE="$APP_MESSAGE" \
            -v ${{ github.workspace }}/host-data:/app/output \
            so-gha-demo

      - name: Show file written by container (container → host)
        run: |
          echo "=== Contenido de host-data/message.txt ==="
          cat host-data/message.txt

      - name: Monitor container resources (CPU/Mem)
        run: docker stats --no-stream so-demo

      - name: Stop and remove container
        run: |
          docker stop so-demo
          docker rm so-demo
